[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ro-climate"
dynamic = ["version"]
description = "Romanian daily gridded climate data from ANM"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Strainu", email = "wiki@strainu.ro" },
]
maintainers = [
    { name = "Strainu", email = "wiki@strainu.ro" },
]
keywords = [
    "climate",
    "meteorology",
    "romania",
    "anm",
    "weather",
    "gridded-data",
    "temperature",
    "precipitation",
    "zarr",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
    "requests>=2.28",
    "zarr>=2.18,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = [
    "pytest>=8",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/strainu/ro_climate"
Documentation = "https://github.com/strainu/ro_climate#readme"
Repository = "https://github.com/strainu/ro_climate"
Issues = "https://github.com/strainu/ro_climate/issues"
Changelog = "https://github.com/strainu/ro_climate/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "ro_climate.__version__" }

[tool.setuptools.packages.find]
include = ["ro_climate*"]

[tool.setuptools.package-data]
ro_climate = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
